name: ASSOU
description: "A Flutter mobile app for voucher/gift card management in Côte d'Ivoire with enterprise-grade architecture."
publish_to: "none"

version: 1.0.0+6

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  http: ^1.2.1
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  qr_flutter:
  mobile_scanner:
  permission_handler:
  android_intent_plus: ^5.0.0
  # device_apps: ^2.1.1  # Discontinued package - functionality removed
  image_picker: ^1.1.1
  url_launcher: ^6.2.1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  provider: ^6.0.5
  intl: ^0.20.2
  connectivity_plus: ^5.0.2
  lottie: ^2.7.0
  app_links: ^6.3.2
  pin_code_fields: ^8.0.1
  cupertino_icons: ^1.0.6
  firebase_core: ^4.0.0
  firebase_messaging:
  flutter_contacts: ^1.1.8
  local_auth: ^2.1.8
  uuid:
  flutter_local_notifications:
  dropdown_button2:
  package_info_plus: ^4.0.0
  build_runner: ^2.4.9
  flutter_native_splash: ^2.4.4
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/assou.png"

flutter_native_splash:
  android: true
  ios: true
  android_gravity: center

  # Couleur de fond (obligatoire)
  color: "#2865F2"

  # Image du logo (optionnel)
  image: assets/images/assouLogo.png

  # Mode sombre (optionnel)
  # color_dark: "#000000"
  #image_dark: assets/images/assouLogo.png

  # Configuration Android
  android_12:
    color: "#2865F2"
    image: assets/images/assouLogo.png
    #image_dark: assets/images/assouLogo.png

  # Plein écran (optionnel)
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
    - fonts/Nunito-Regular.ttf
    - fonts/Nunito-Bold.ttf
    - fonts/Nunito-Light.ttf
    - fonts/Nunito-Medium.ttf
    - fonts/Nunito-SemiBold.ttf

  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-Light.ttf
          weight: 300
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
